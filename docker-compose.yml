services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: futurehuman
      POSTGRES_PASSWORD: futurehuman
      POSTGRES_DB: futurehuman
    ports:
      - "5432:5432"
    volumes:
      - futurehuman_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futurehuman"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - futurehuman_redis:/data

volumes:
  futurehuman_pg:
  futurehuman_redis:
